name: ab-ignite-frontend

services:
  frontend:
    image: ab-ignite-frontend:production
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AUTH_REFRESH_INTERVAL_SECONDS: ${NEXT_PUBLIC_AUTH_REFRESH_INTERVAL_SECONDS:-600}
        API_INTERNAL_URL: http://api:4100
        AUTH_URL: ${AUTH_URL:-http://localhost:3100}
    env_file:
      - path: ./.env
        required: true
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4100
    init: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    networks:
      - api_private
    ports:
      - "127.0.0.1:3100:3000"
      - "172.17.0.1:3100:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "docker/healthcheck.mjs"]
      interval: 15s
      timeout: 6s
      start_period: 45s
      retries: 4

networks:
  api_private:
    name: ab-ignite-local_api_private
    external: true
